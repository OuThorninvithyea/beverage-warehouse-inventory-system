name: Bug report
description: Report a reproducible problem
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Submit ...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, request payloads or barcode values without including secrets.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 - blocks the project or risks data integrity
        - P1 - major feature does not work
        - P2 - minor issue or workaround exists
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser/device, branch or commit, backend/frontend version.
