services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: bwims
      POSTGRES_USER: bwims
      POSTGRES_PASSWORD: bwims
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bwims -d bwims"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - bwims_net

  migrate:
    image: migrate/migrate:v4.18.3
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://bwims:bwims@postgres:5432/bwims?sslmode=disable"
      - "up"
    networks:
      - bwims_net

  api:
    build:
      context: ./backend
    container_name: api
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8080
      DATABASE_URL: postgres://bwims:bwims@postgres:5432/bwims?sslmode=disable
      DB_MAX_CONNECTIONS: 10
      DB_MIN_CONNECTIONS: 2
      DB_CONNECT_TIMEOUT: 5s
      SHUTDOWN_TIMEOUT: 10s
      JWT_ISSUER: bwims-api
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - bwims_net

  seed:
    build:
      context: ./backend
    container_name: seed
    entrypoint: ["bwims-seed"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://bwims:bwims@postgres:5432/bwims?sslmode=disable
      DB_MAX_CONNECTIONS: 2
      DB_MIN_CONNECTIONS: 0
      DB_CONNECT_TIMEOUT: 5s
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@bwims.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Development Administrator}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-DemoPass123!}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - bwims_net

  frontend:
    profiles:
      - optional-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: frontend
    ports:
      - "6001:80"
    depends_on:
      - api
    networks:
      - bwims_net

networks:
  bwims_net:
    driver: bridge

volumes:
  postgres_data:
